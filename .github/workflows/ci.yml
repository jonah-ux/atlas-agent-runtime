name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: python -m pytest -q
      - run: python scripts/audit_public_surface.py --json
      - run: python -m compileall -q src tests scripts
      - name: Build source conformance resource
        run: |
          python -m pip install build
          python -m build --sdist --wheel
          python - <<'PY'
          from pathlib import Path
          import tarfile
          relative = "conformance/agent-systems-lab.json"
          with tarfile.open(next(Path("dist").glob("*.tar.gz"))) as archive:
              members = [member for member in archive.getmembers() if member.name.split("/", 1)[-1] == relative]
              assert len(members) == 1 and members[0].isfile(), "owner manifest missing or duplicated"
              assert archive.extractfile(members[0]).read() == Path(relative).read_bytes(), "owner manifest bytes changed"
          print("Source distribution contains the exact owner conformance manifest")
          PY
