[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-agent-runtime"
version = "0.1.1"
description = "A small durable runtime for inspectable, approval-gated AI tasks"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Jonah Helland"}]
dependencies = []

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
